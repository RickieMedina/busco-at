<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulación Aceptada</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .header { background: linear-gradient(90deg, #6a11cb, #2575fc); padding: 20px; text-align: center; color: #ffffff; }
        .header img { width: 50px; }
        .content { padding: 20px; text-align: center; }
        .content h1 { color: #333333; }
        .content p { color: #666666; }
        .footer { padding: 20px; text-align: center; font-size: 14px; color: #888888; }
        .footer a { color: #2575fc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- <img src="https://example.com/check-icon.png" alt="Aceptado"> -->
            <h2>¡Felicidades! Tu postulación ha sido aceptada</h2>
        </div>
        <div class="content">
            <h1>Gracias por postularte</h1>
            <p>Nos complace informarte que has sido seleccionado en tu postulación. Por favor, mantente atento a los futuros mensajes del empleador.</p>
        </div>
        <div class="footer">
            <p>Gracias por confiar en <strong>BuscoAT</strong>. ¡Te deseamos mucho éxito!</p>
            <p><a href="http//:localhost:3000/">Visita nuestro sitio web</a></p>
        </div>
    </div>
</body>
</html>
